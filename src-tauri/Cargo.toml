[workspace]
members = ["cli"]
resolver = "2"

[package]
name = "ultra-gitlab"
version = "0.25.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "ultra-gitlab"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ultra_gitlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# HTTP Client for GitLab API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI installer (tar.gz extraction)
flate2 = "1"
tar = "0.4"

# Error Handling
thiserror = "2"

# Logging
log = "0.4"
tauri-plugin-log = "2"
env_logger = "0.11"  # used by bench_sync binary

# System Information (memory, CPU)
sysinfo = "0.32"

# Async Runtime
tokio = { version = "1", features = ["sync", "time", "net", "rt-multi-thread"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
# Transitive dep (via tokio/sqlx/cookie). Pinned because time 0.3.48 fails to
# build (E0119 in time's own format_item module) on current rustc. Without this
# pin, `cargo generate-lockfile` in scripts/bump-version.ts re-resolves it
# forward on every release and reintroduces the broken build.
time = "=0.3.47"

# URL Encoding
urlencoding = "2"

# Base64 Encoding
base64 = "0.22"

# Hashing (SHA-256 for file content dedup)
sha2 = "0.10"

# System font enumeration
fontdb = "0.22"

# Secure Credential Storage (OS keychain)
keyring = "3"
futures = "0.3.31"

# UUID generation
uuid = { version = "1", features = ["v4"] }

tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
notify-rust = "4"
block2 = "0.6"
objc2-user-notifications = "0.3"
objc2-foundation = "0.3"

[target."cfg(target_os = \"ios\")".dependencies]
objc2 = "0.6"

# Haptic feedback (UIImpactFeedbackGenerator on iOS). Mobile-only — the plugin
# does not build for desktop targets.
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-haptics = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-aptabase = "1"
user-notify = "0.4"

[[bin]]
name = "bench_sync"
path = "src/bin/bench_sync.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
